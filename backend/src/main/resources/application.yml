server:
  port: 8080

spring:
  application:
    name: lawtest-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lawtest}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:lawtest123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # 活动现场目标人数（大屏进度 X/Y 的 Y）
  target-participants: ${TARGET_PARTICIPANTS:200}
  live:
    # 手机端心跳活跃判定窗口（秒），超过则视为已离开
    active-ttl-seconds: ${LIVE_ACTIVE_TTL_SECONDS:90}
  ai:
    base-url: ${AI_BASE_URL:https://api.xiaomimimo.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:mimo-v2.5-pro}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}

logging:
  level:
    com.lawtest: info
