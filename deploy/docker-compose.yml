# 五彩法途系统 Docker Compose 编排
# 用法：docker compose up -d --build（在线）
#       现场离线：docker compose up -d --no-build（需先 docker load 镜像）

name: lawtest

services:
  nginx:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: lawtest-frontend:latest
    container_name: lawtest-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: lawtest-backend:latest
    container_name: lawtest-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lawtest
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-lawtest123}
      # 二维码内容前缀：现场改为访问地址，如 http://192.168.1.15:80
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      # AI 大模型分析（小米 MiMo，OpenAI 兼容接口）
      AI_BASE_URL: ${AI_BASE_URL:-https://api.xiaomimimo.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-mimo-v2.5-pro}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: lawtest-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-lawtest123}
      MYSQL_DATABASE: lawtest
      # 确保初始化脚本以 UTF-8 读入，避免中文双重编码
      LANG: C.UTF-8
    volumes:
      - db_data:/var/lib/mysql
      # 首次启动自动执行建表与初始化数据（顺序执行 01/02）
      - ../sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT_EXPOSE:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-lawtest123}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  db_data:
